<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cash Record Virtual</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    padding: 0;
    text-align: center;
    color: #ffffff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    background: #1c231d url("banner.png") center center / cover no-repeat;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(rgba(28,35,29,0) 25%, rgba(18,23,19,.60) 55%, rgba(12,16,12,.90) 100%);
    pointer-events: none;
    z-index: 0;
  }
  .banner-img { display: none; }
  .menu, .welcome, footer { position: relative; z-index: 1; background: transparent; }
  .menu {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 14px 16px 10px;
  }
  .card {
    border: 2px solid #ff5a1f;
    border-radius: 12px;
    padding: 22px 18px;
    width: 210px;
    text-decoration: none;
    color: #ffffff;
    background: rgba(26,33,27,.78);
    backdrop-filter: blur(3px);
    box-shadow: 0 6px 22px rgba(0,0,0,.55);
    transition: transform .2s, background .2s;
  }
  .card:hover { transform: translateY(-5px); background: #ff5a1f; color: #1c231d; }
  .card h2 { margin: 0; font-size: 1.25em; text-transform: uppercase; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .welcome { flex: 0 0 auto; padding: 6px 20px 14px; }
  .welcome p { margin: 0; font-size: 1.2em; letter-spacing: .04em; text-shadow: 0 2px 8px rgba(0,0,0,.85); }
  footer { flex: 0 0 auto; padding: 12px 20px; background: rgba(10,13,10,.72); color: #999999; font-size: .9em; }

  @media (max-width: 819px) {
    .card { width: calc(50% - 10px); max-width: 210px; padding: 18px 12px; }
    .card h2 { font-size: 1.05em; }
    .welcome p { font-size: 1em; }
  }
  @media (max-width: 420px) {
    .menu { gap: 12px; padding: 10px 12px 8px; }
    .card { padding: 14px 10px; }
  }
</style>
</head>
<body>
  <img class="banner-img" src="banner.png" alt="Cash Record - Expertos en tu negocio">

  <div class="menu">
    <a class="card" href="bodega.html" onclick="try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}catch(e){}">
      <h2>Bodega</h2>
    </a>
    <a class="card" href="carniceria.html" onclick="try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}catch(e){}">
      <h2>Carnicería</h2>
    </a>
    <a class="card" href="pescaderia.html" onclick="try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}catch(e){}">
      <h2>Pescadería</h2>
    </a>
    <a class="card" href="fruteria.html" onclick="try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}catch(e){}">
      <h2>Frutería</h2>
    </a>
  </div>

  <div class="welcome">
    <p>Selecciona una sección para continuar</p>
  </div>

  <footer>
    &copy; 2026 Cash Record Virtual &mdash; Para ti, profesional
  </footer>
</body>
</html>
