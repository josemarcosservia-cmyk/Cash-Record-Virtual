<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Carnicería · Cash Record</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1c231d;
    color: #ffffff;
    text-align: center;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }
  header {
    padding: 26px 20px 18px;
    border-bottom: 2px solid #ff5a1f;
  }
  header h1 {
    margin: 0;
    font-size: 2em;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: #ff5a1f;
  }
  header p {
    margin: 8px 0 0;
    color: #b9c2ba;
    font-size: .9em;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  main {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 30px 20px;
  }
  .panel {
    background: #2a332b;
    border: 2px solid #ff5a1f;
    border-radius: 14px;
    padding: 34px 28px;
    max-width: 560px;
    box-shadow: 0 6px 22px rgba(0,0,0,.45);
  }
  .panel h2 { margin: 0 0 10px; font-size: 1.3em; }
  .panel p { margin: 0; color: #cfd6d0; line-height: 1.5; }
  .back {
    display: inline-block;
    padding: 12px 26px;
    border: 2px solid #ff5a1f;
    border-radius: 10px;
    color: #ffffff;
    text-decoration: none;
    transition: background .2s, color .2s;
  }
  .back:hover { background: #ff5a1f; color: #1c231d; }
  footer { padding: 14px 20px; background: #14180f; color: #999999; font-size: .9em; }
</style>
</head>
<body>
  <header>
    <h1>Carnicería</h1>
    <p>Cash Record Virtual</p>
  </header>

  <main>
    <div class="panel">
      <h2>Sección en preparación</h2>
      <p>Aquí iremos montando el contenido de la carnicería: productos, precios y registro de caja.</p>
    </div>
    <a class="back" href="index.html">Volver al inicio</a>
  </main>

  <footer>
    &copy; 2026 Cash Record Virtual &mdash; Para ti, profesional
  </footer>
</body>
</html>
