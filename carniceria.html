<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Carnicería · Cash Record</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1c231d;
    color: #ffffff;
    text-align: center;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }
  header {
    padding: 20px 20px 14px;
    border-bottom: 2px solid #ff5a1f;
  }
  header h1 {
    margin: 0;
    font-size: 1.8em;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: #ff5a1f;
  }
  #ruta {
    margin: 8px 0 0;
    color: #b9c2ba;
    font-size: .88em;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  main {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px 18px;
  }
  .contenido {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 26px;
    width: 100%;
    max-width: 1180px;
  }
  .columna {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    width: 100%;
    max-width: 720px;
  }
  .card {
    font: inherit;
    color: #ffffff;
    background: #2a332b;
    border: 2px solid #ff5a1f;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.45);
    padding: 20px 14px;
    width: 200px;
    min-height: 80px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: .03em;
    font-size: 1em;
    transition: transform .18s, background .18s, color .18s;
  }
  .card:hover { transform: translateY(-4px); background: #ff5a1f; color: #1c231d; }
  .card.sel { background: #ff5a1f; color: #1c231d; }
  .aviso { margin: 0; color: #cfd6d0; max-width: 560px; line-height: 1.5; }
  .ficha {
    display: none;
    flex: 0 0 330px;
    width: 330px;
    text-align: left;
    background: #2a332b;
    border: 2px solid #ff5a1f;
    border-radius: 14px;
    box-shadow: 0 6px 22px rgba(0,0,0,.5);
    padding: 18px 18px 20px;
    max-height: 72vh;
    overflow-y: auto;
  }
  .ficha img {
    display: block;
    width: 100%;
    max-width: 250px;
    margin: 0 auto 14px;
    border-radius: 10px;
    background: #ffffff;
  }
  .ficha h2 {
    margin: 0 0 8px;
    font-size: 1.1em;
    color: #ff5a1f;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .ficha h3 {
    margin: 16px 0 6px;
    font-size: .82em;
    color: #ff5a1f;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .ficha p { margin: 0 0 8px; color: #cfd6d0; font-size: .9em; line-height: 1.55; }
  .ficha ul { margin: 0; padding-left: 18px; color: #cfd6d0; font-size: .9em; line-height: 1.55; }
  .ficha li { margin-bottom: 4px; }
  .acciones {
    display: flex;
    justify-content: center;
    gap: 14px;
    padding: 0 18px 20px;
  }
  .btn {
    display: inline-block;
    padding: 11px 24px;
    border: 2px solid #ff5a1f;
    border-radius: 10px;
    color: #ffffff;
    background: transparent;
    font: inherit;
    cursor: pointer;
    text-decoration: none;
    transition: background .2s, color .2s;
  }
  .btn:hover { background: #ff5a1f; color: #1c231d; }
  footer { padding: 12px 20px; background: #14180f; color: #999999; font-size: .88em; }

  @media (max-width: 960px) {
    main { align-items: flex-start; }
    .contenido { flex-direction: column; align-items: center; }
    .ficha { flex: 0 0 auto; width: 100%; max-width: 560px; max-height: none; }
  }
  @media (max-width: 700px) {
    .card { width: calc(50% - 8px); padding: 16px 10px; font-size: .92em; }
    header h1 { font-size: 1.45em; }
  }
</style>
</head>
<body>
  <header>
    <h1>Carnicería</h1>
    <p id="ruta">Cash Record Virtual</p>
  </header>

  <main>
    <div class="contenido">
      <div class="columna">
        <div id="grid" class="grid"></div>
        <p id="aviso" class="aviso"></p>
      </div>
      <aside id="ficha" class="ficha"></aside>
    </div>
  </main>

  <nav class="acciones">
    <button type="button" class="btn" id="atras">Atrás</button>
    <a class="btn" href="index.html">Inicio</a>
  </nav>

  <footer>
    &copy; 2026 Cash Record Virtual &mdash; Para ti, profesional
  </footer>

<script>
var DATOS = [
  { nombre: "Vacuno", sub: [
      { nombre: "Ternera", items: ["Ternera Gallega Suprema", "Ternera Gallega", "Ternera Nacional", "Ternera Importación"] },
      { nombre: "Vaca", items: ["Vaca Gallega", "Vaca Nacional", "Vaca Importación"] }
  ] },
  { nombre: "Aves", sub: [
      { nombre: "Pollo", items: [] },
      { nombre: "Pavo", items: [] }
  ] },
  { nombre: "Cerdo", sub: [
      { nombre: "Cerdo Blanco", items: [] },
      { nombre: "Cerdo Ibérico", items: [] },
      { nombre: "Cerdo Duroc", items: [] }
  ] },
  { nombre: "Elaborados", sub: [
      { nombre: "Hamburguesas", items: [] },
      { nombre: "Carne Picada", items: [] },
      { nombre: "Albóndigas", items: [] },
      { nombre: "Raxo", items: [] },
      { nombre: "Chorizos", items: [] }
  ] },
  { nombre: "Salado", sub: [] },
  { nombre: "Curado", sub: [] }
];

var FICHAS = {
  "Ternera Gallega Suprema": {
    imagen: "img/ternera-gallega-suprema.png",
    intro: "Carne certificada por la IGP Ternera Gallega procedente de animales menores de 10 meses criados en explotaciones tradicionales con vacas madres. La lactancia materna mínima de 7 meses le aporta una terneza extrema, mucha jugosidad y un sabor muy suave.",
    bloques: [
      { titulo: "Origen y crianza", lineas: [
        "Edad de sacrificio: menores de 10 meses.",
        "Lactancia: leche materna durante al menos 7 meses.",
        "Alimentación complementaria: forrajes, cereales, patatas, nabos y concentrados vegetales autorizados.",
        "Modelo de granja: explotaciones familiares tradicionales de Galicia con vacas nodrizas."
      ] },
      { titulo: "Aspecto y propiedades", lineas: [
        "Color: de rosa claro a rojo suave.",
        "Textura y grano: músculo de grano fino, aspecto magro y consistencia muy firme.",
        "Grasa: entre blanca nacarada y amarillo suave, de textura cremosa."
      ] },
      { titulo: "Identificación y etiquetado", lineas: [
        "Contraetiqueta rosa con la palabra SUPREMA y los logos de la IGP y de la Unión Europea.",
        "Puede incluir menciones si procede de raza Rubia Gallega o de ganadería con certificación ecológica (etiqueta verde)."
      ] }
    ]
  }
};

var ruta = [];
var sel = null;

function itemsActuales() {
  if (ruta.length !== 2) { return []; }
  var sub = (DATOS[ruta[0]].sub || [])[ruta[1]];
  return (sub && sub.items) || [];
}

function opciones() {
  if (ruta.length === 0) {
    return DATOS.map(function (c) { return c.nombre; });
  }
  if (ruta.length === 1) {
    return (DATOS[ruta[0]].sub || []).map(function (s) { return s.nombre; });
  }
  return itemsActuales().slice();
}

function textoRuta() {
  var partes = ["Carnicería"];
  if (ruta.length > 0) { partes.push(DATOS[ruta[0]].nombre); }
  if (ruta.length > 1) { partes.push(DATOS[ruta[0]].sub[ruta[1]].nombre); }
  if (ruta.length === 2 && sel !== null) { partes.push(itemsActuales()[sel]); }
  return partes.join(" › ");
}

function pintarFicha() {
  var aside = document.getElementById("ficha");
  if (ruta.length !== 2 || sel === null) {
    aside.style.display = "none";
    aside.innerHTML = "";
    return;
  }
  var nombre = itemsActuales()[sel];
  var f = FICHAS[nombre];
  var html = "";
  if (f && f.imagen) {
    html += '<img src="' + f.imagen + '" alt="Etiqueta de ' + nombre + '">';
  }
  html += "<h2>" + nombre + "</h2>";
  if (f) {
    if (f.intro) { html += "<p>" + f.intro + "</p>"; }
    (f.bloques || []).forEach(function (b) {
      html += "<h3>" + b.titulo + "</h3><ul>";
      b.lineas.forEach(function (l) { html += "<li>" + l + "</li>"; });
      html += "</ul>";
    });
  } else {
    html += "<p>Ficha en preparación. La iremos completando.</p>";
  }
  aside.innerHTML = html;
  aside.style.display = "block";
}

function pintar() {
  var grid = document.getElementById("grid");
  var aviso = document.getElementById("aviso");
  var atras = document.getElementById("atras");
  grid.innerHTML = "";
  document.getElementById("ruta").textContent = textoRuta();
  atras.style.visibility = (ruta.length > 0 || sel !== null) ? "visible" : "hidden";
  var lista = opciones();
  if (lista.length === 0) {
    aviso.textContent = "Esta sección todavía no tiene contenido. La iremos completando.";
  } else {
    aviso.textContent = "";
    lista.forEach(function (nombre, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "card" + (ruta.length === 2 && sel === i ? " sel" : "");
      b.textContent = nombre;
      b.addEventListener("click", function () {
        if (ruta.length < 2) {
          ruta.push(i);
          sel = null;
        } else {
          sel = (sel === i) ? null : i;
        }
        pintar();
      });
      grid.appendChild(b);
    });
  }
  pintarFicha();
}

document.getElementById("atras").addEventListener("click", function () {
  if (sel !== null) { sel = null; } else { ruta.pop(); }
  pintar();
});

pintar();
</script>
</body>
</html>
