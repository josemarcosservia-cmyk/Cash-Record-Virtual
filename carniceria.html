<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Carnicería · Registro de caja</title>
<style>
*{box-sizing:border-box;}
html, body{height: 100%;}
body{
margin: 0;
font-family: 'Segoe UI',Arial,sans-serif;
background: #1c231d;
color: #ffffff;
text-align:center;
display:flex;
flex-direction:column;
min-height: 100vh;
min-height: 100dvh;
}
header{
padding: 18px 20px 12px;
border-bottom: 2px solid#ff5a1f;
display: flex;
align-items: center;
justify-content: space-between;
}
header h1{
margin: 0;
font-size: 1.75em;
letter-spacing: 0.06em;
text-transform:uppercase;
color: #ff5a1f;
}
header a{
color: #ffffff;
font-size: 0.85em;
text-decoration:none;
padding: 8px 14px;
border: 1px solid #ff5a1f;
border-radius: 4px;
transition:all 0.3s;
}
header a:hover{
background: #ff5a1f;
color: #1c231d;
}
main{
flex: 1 1auto;
display:flex;
align-items:center;
justify-content:center;
padding: 20px 18px;
}
.contenido{
display:flex;
align-items: flex-start;
justify-content:center;
gap: 24px;
width: 100%;
max-width: 1180px;
flex-wrap: wrap;
}
.columna{
flex: 1 1auto;
display:flex;
flex-direction:column;
align-items:center;
gap: 16px;
min-width: 0;
}
.ficha{
display:flex;
flex-direction:column;
gap: 12px;
width: 100%;
max-width: 340px;
padding: 16px;
background: rgba(255,90,31,0.08);
border: 1px solid #ff5a1f;
border-radius: 12px;
}
.ficha h2{
font-size: 1.25em;
margin: 0;
text-transform:uppercase;
letter-spacing: 0.04em;
color: #ff5a1f;
}
.ficha .cuerpo {
font-size: 0.9em;
line-height: 1.6;
margin: 12px 0;
}
.ficha ul{
list-style:none;
padding: 0;
margin: 8px 0;
}
.ficha li{
padding: 4px 0 4px 16px;
}
.ficha li::before{
content:"▪";
margin-right: 8px;
color: #ff5a1f;
}
.ficha img{
width: 100%;
height: auto;
border-radius: 8px;
margin: 12px 0;
}
.cargador {
text-align: center;
padding: 40px;
color: #b9c2ba;
}
.detalles{
font-size: 0.85em;
display: grid;
grid-template-columns: 1fr 1fr;
gap: 8px;
}
.detalle{
border-top: 1px solid rgba(255,90,31,0.2);
padding: 8px 0;
}
.detalle-label{
font-weight: bold;
color: #ff5a1f;
}
@media (max-width: 820px) {
  .contenido{
    align-items:center;
    width: 100%;
  }
  .columna{
    width: 100%;
  }
}
</style>
</head>
<body>
<header>
<h1>🥩 Carnicería</h1>
<a href="editor-carniceria.html">✏️ Editar Productos</a>
</header>

<main>
<div class="contenido" id="contenido">
<div class="cargador">📦 Cargando productos...</div>
</div>
</main>

<script>
async function cargarProductos() {
  try {
    let datosJson = localStorage.getItem('carniceria_data');
    
    if (!datosJson) {
      const respuesta = await fetch('https://api.github.com/repos/josemarcosservia-cmyk/Cash-Record-Virtual/contents/carniceria-productos.json');
      const datos = await respuesta.json();
      datosJson = atob(datos.content);
      localStorage.setItem('carniceria_data', datosJson);
    }
    
    const productos = JSON.parse(datosJson);
    renderizarProductos(productos);
  } catch (error) {
    console.error('Error:', error);
    document.getElementById('contenido').innerHTML = '<div class="cargador">❌ Error al cargar productos</div>';
  }
}

function renderizarProductos(productos) {
  if (!Array.isArray(productos) || productos.length === 0) {
    document.getElementById('contenido').innerHTML = '<div class="cargador">No hay productos disponibles</div>';
    return;
  }
  
  let html = '';
  
  productos.forEach(producto => {
    html += `
      <div class="ficha">
        <h2>${escaparHtml(producto.nombre)}</h2>
        <div class="cuerpo">${escaparHtml(producto.descripción || '')}</div>
        
        <div class="detalles">
          <div class="detalle"><span class="detalle-label">Código:</span><br>${escaparHtml(producto.código)}</div>
          <div class="detalle"><span class="detalle-label">Categoría:</span><br>${escaparHtml(producto.categoría)}</div>
          <div class="detalle"><span class="detalle-label">Origen:</span><br>${escaparHtml(producto.origen)}</div>
          <div class="detalle"><span class="detalle-label">Formato:</span><br>${escaparHtml(producto.formato)}</div>
        </div>
        
        ${producto.imagen ? `<img src="${escaparHtml(producto.imagen)}" alt="${escaparHtml(producto.nombre)}" style="max-width:100%; height:auto;">` : ''}
        
        ${producto.trazabilidad ? `<div style="font-size:0.8em; color:#b9c2ba; margin-top:8px;"><em>Trazabilidad: ${escaparHtml(producto.trazabilidad)}</em></div>` : ''}
      </div>
    `;
  });
  
  document.getElementById('contenido').innerHTML = html;
}

function escaparHtml(texto) {
  const mapa = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return String(texto || '').replace(/[&<>"']/g, m => mapa[m]);
}

window.addEventListener('storage', function(evento) {
  if (evento.key === 'carniceria_data') {
    cargarProductos();
  }
});

cargarProductos();

setInterval(() => {
  const datosGuardados = localStorage.getItem('carniceria_data');
  if (datosGuardados) {
    cargarProductos();
  }
}, 5000);
</script>

</body>
</html>
