<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bodega de Cash Record</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Marcellus+SC&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0c0806}
.stage{position:fixed;inset:0;perspective:1400px;perspective-origin:50% 48%;}
.interior{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(8,5,3,.18) 0%,transparent 22%,transparent 72%,rgba(8,5,3,.55) 100%),
    url('bodega-fondo.jpg') center/cover no-repeat;
  background-size:cover;
}
.etiquetas-layer{
  position:absolute;inset:0;pointer-events:none;
  opacity:0;transition:opacity .8s ease 2.4s;
}
.stage.open .etiquetas-layer{opacity:1;pointer-events:auto;}
.banderola{
  position:absolute;
  display:flex;flex-direction:column;align-items:center;
  transform-origin:top center;
  transform:rotate(var(--swing,0deg));
  opacity:0;translate:0 -8px;
  transition:opacity .5s ease var(--d,0s), translate .5s ease var(--d,0s), filter .25s ease;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.75));
  cursor:pointer;
}
.stage.open .banderola{opacity:1;translate:0 0;}
.banderola:hover,.banderola:focus-visible{
  filter:drop-shadow(0 6px 16px rgba(0,0,0,.9)) brightness(1.1);
  z-index:20;outline:none;
  animation:sway .55s ease-in-out;
}
@keyframes sway{
  0%{transform:rotate(var(--swing,0deg))}
  30%{transform:rotate(calc(var(--swing,0deg) + 3.5deg))}
  65%{transform:rotate(calc(var(--swing,0deg) - 2deg))}
  100%{transform:rotate(var(--swing,0deg))}
}
.hilo{
  width:1.5px;height:14px;
  background:linear-gradient(180deg,rgba(180,150,70,0),rgba(180,150,70,.9));
  flex-shrink:0;
}
.flag{width:64px;position:relative;}
.flag-top{
  background:var(--color,#7a2233);
  padding:4px 5px 3px;text-align:center;
  border-radius:2px 2px 0 0;
}
.flag-top .region{
  display:block;font:.4rem/1 'Marcellus SC',serif;
  letter-spacing:.16em;color:rgba(255,255,255,.62);text-transform:uppercase;
}
.flag-top .doname{
  display:block;font:.62rem/1.15 'Marcellus',serif;
  color:#fff;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60px;
}
.flag-body{
  background:linear-gradient(170deg,#f2e5c2,#e3cf98);
  padding:5px 4px 4px;text-align:center;
  border-left:1.5px solid rgba(0,0,0,.18);
  border-right:1.5px solid rgba(0,0,0,.18);
}
.flag-body .seal{
  font:700 1rem/1 'Marcellus SC',serif;
  color:var(--color,#7a2233);
  letter-spacing:-.01em;
}
.flag-tip{
  width:64px;height:20px;
  background:linear-gradient(170deg,#f2e5c2,#e3cf98);
  clip-path:polygon(0 0,100% 0,50% 100%);
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.3));
}
.frame{
  position:absolute;inset:0;z-index:3;pointer-events:none;
  box-shadow:
    inset 0 0 0 clamp(28px,6vw,68px) #2a2018,
    inset 0 0 0 calc(clamp(28px,6vw,68px) + 4px) #141009,
    inset 0 0 110px 28px rgba(0,0,0,.7);
}
.frame::after{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:clamp(110px,17vw,190px);height:clamp(36px,5.5vw,66px);
  background:linear-gradient(180deg,#3a2e1e,#22180e);
  clip-path:polygon(16% 0,84% 0,100% 100%,0 100%);
}
.transom{
  position:absolute;top:clamp(10px,2.2vw,24px);left:50%;transform:translateX(-50%);
  text-align:center;z-index:4;pointer-events:none;white-space:nowrap;
  text-shadow:0 2px 12px rgba(0,0,0,.95);
}
.transom .name{font:400 clamp(.85rem,2.8vw,1.9rem)/1.1 'Marcellus',serif;letter-spacing:.14em;color:#c9a24b;}
.transom .sub{font:.58rem/1 'Marcellus SC',serif;letter-spacing:.36em;color:rgba(220,200,145,.5);text-transform:uppercase;margin-top:2px;}
.doors{position:absolute;inset:0;z-index:1;transform-style:preserve-3d;pointer-events:auto;cursor:pointer;}
.door{
  position:absolute;top:0;bottom:0;width:50%;
  background:
    linear-gradient(90deg,rgba(0,0,0,.42),transparent 18%,transparent 82%,rgba(0,0,0,.42)),
    repeating-linear-gradient(90deg,#1c0d04 0 2px,#3a2416 2px 26px,#4e3020 26px 27px,#3a2416 27px 52px);
  box-shadow:inset 0 0 70px rgba(0,0,0,.55);
  transition:transform 2.3s cubic-bezier(.48,.04,.18,1);
  backface-visibility:hidden;will-change:transform;
}
.door::before,.door::after{
  content:"";position:absolute;left:7%;right:7%;height:12px;
  background:linear-gradient(180deg,#1a1410,#0a0806);border-radius:2px;
}
.door::before{top:14%}.door::after{bottom:14%}
.door.left{left:0;transform-origin:left center;border-right:2px solid #0a0604;}
.door.right{right:0;transform-origin:right center;}
.stage.open .door.left{transform:rotateY(-122deg);}
.stage.open .door.right{transform:rotateY(122deg);}
.handle{
  position:absolute;top:50%;width:40px;height:40px;
  border:5px solid #100e0b;border-radius:50%;
  background:radial-gradient(circle at 38% 33%,#4a3f32,#12100c);
  box-shadow:0 3px 7px rgba(0,0,0,.6);transform:translateY(-50%);
}
.door.left  .handle{right:11px;}
.door.right .handle{left:11px;}
.seam{
  position:absolute;top:5%;bottom:5%;left:50%;width:3px;transform:translateX(-50%);
  background:linear-gradient(180deg,transparent,#f4ce82,#e8a94e,transparent);
  filter:blur(2px);opacity:.9;z-index:2;
  animation:flicker 4s ease-in-out infinite;transition:opacity .5s ease;
}
.stage.open .seam{opacity:0;}
@keyframes flicker{0%,100%{opacity:.85}48%{opacity:1}72%{opacity:.7}}
.hint{
  position:absolute;bottom:clamp(26px,4.5vh,48px);left:50%;transform:translateX(-50%);
  z-index:7;text-align:center;pointer-events:none;
  font:.62rem/1 'Marcellus SC',serif;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(220,200,145,.58);animation:breathe 3s ease-in-out infinite;transition:opacity .5s ease;
}
.hint span{display:block;margin-top:.4em;font-size:1.2rem;color:#c9a24b;}
.stage.open .hint{opacity:0;}
@keyframes breathe{0%,100%{opacity:.38}50%{opacity:1}}
.btn-close{
  position:fixed;top:14px;right:14px;z-index:20;
  font:.62rem/1 'Marcellus SC',serif;letter-spacing:.18em;
  color:#e3d3ad;background:rgba(14,9,5,.72);
  border:1px solid rgba(201,162,75,.4);border-radius:2px;
  padding:8px 14px;cursor:pointer;
  opacity:0;pointer-events:none;
  transition:opacity .5s ease 2.2s;backdrop-filter:blur(4px);
}
.stage.open .btn-close{opacity:1;pointer-events:auto;}
.btn-close:hover{border-color:#c9a24b;color:#f4ce82;}
.tooltip{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;
  background:rgba(10,6,3,.88);border:1px solid rgba(201,162,75,.4);
  border-radius:3px;padding:8px 16px;
  font:.76rem/1.45 Georgia,serif;color:#e3d3ad;
  text-align:center;max-width:280px;backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .25s ease;white-space:nowrap;
}
.tooltip.show{opacity:1;}
.tooltip strong{color:#c9a24b;font-size:.84rem;display:block;margin-bottom:2px;}
@media(max-width:560px){
  .frame{box-shadow:inset 0 0 0 22px #2a2018,inset 0 0 0 26px #141009,inset 0 0 70px 14px rgba(0,0,0,.7);}
  .flag,.flag-tip{width:52px}.flag-top .doname{font-size:.52rem;max-width:48px}
}
@media(prefers-reduced-motion:reduce){
  .door,.banderola,.etiquetas-layer{transition-duration:.3s}
  .seam,.hint{animation:none}.seam{opacity:.6}
  .banderola:hover{animation:none}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="interior">
    <div class="etiquetas-layer" id="etiquetasLayer"></div>
  </div>
  <div style="position:absolute;inset:0;z-index:6;pointer-events:none;">
    <div class="frame"></div>
    <div class="transom">
      <div class="name">Bodega de Cash Record</div>
      <div class="sub">denominaciones de origen</div>
    </div>
    <div class="doors" id="doors" role="button" tabindex="0" aria-label="Abrir las puertas" style="pointer-events:auto;">
      <div class="seam"></div>
      <div class="door left"><div class="handle"></div></div>
      <div class="door right"><div class="handle"></div></div>
    </div>
  </div>
  <div class="hint">Pulsa las puertas<span>&#9660;</span></div>
  <button class="btn-close" id="btnClose">&#10005; Cerrar</button>
</div>
<div class="tooltip" id="tooltip"></div>
<script>
var DOS = [
  {do:'Rias Baixas',     region:'Galicia',         seal:'RB', color:'#3a6038', note:'Albarino atlantico, fresco y mineral'},
  {do:'Ribeiro',         region:'Galicia',         seal:'RO', color:'#7a3a18', note:'Treixadura aromatica, tradicion ribereña'},
  {do:'Valdeorras',      region:'Galicia',         seal:'VO', color:'#2a4870', note:'Godello de altura, untuoso y elegante'},
  {do:'Ribeira Sacra',   region:'Galicia',         seal:'RS', color:'#582060', note:'Mencia de pizarra, tinto floral y ligero'},
  {do:'Rioja',           region:'La Rioja',        seal:'RI', color:'#8a1c2a', note:'Tempranillo clasico, referencia española'},
  {do:'Ribera del Duero',region:'Castilla y Leon', seal:'RD', color:'#6e1a12', note:'Tinto Fino potente, largo envejecimiento'},
  {do:'Rueda',           region:'Castilla y Leon', seal:'RU', color:'#4a7020', note:'Verdejo fresco y afrutado, muy versatil'},
  {do:'Toro',            region:'Castilla y Leon', seal:'TO', color:'#6a2c10', note:'Tinta de Toro, intenso y corpulento'},
  {do:'Priorat',         region:'Catalunya',       seal:'PR', color:'#4a1a50', note:'Garnacha y Cariñena sobre llicorella'},
  {do:'Penedes',         region:'Catalunya',       seal:'PE', color:'#1a4a38', note:'Variedades internacionales y cava'},
  {do:'Cava',            region:'España',          seal:'CV', color:'#6a5610', note:'Espumoso metodo tradicional, burbujas finas'},
  {do:'Jumilla',         region:'Murcia',          seal:'JU', color:'#6a1018', note:'Monastrell concentrado, sol levantino'},
];
var POS = [
  {l:8,  t:10, sw:'-1.5deg'}, {l:18, t:10, sw:'1deg'},
  {l:8,  t:36, sw:'1.5deg'},  {l:18, t:36, sw:'-1deg'},
  {l:8,  t:62, sw:'-2deg'},   {l:18, t:62, sw:'1.5deg'},
  {l:66, t:10, sw:'1.5deg'},  {l:76, t:10, sw:'-1deg'},
  {l:66, t:36, sw:'-1.5deg'}, {l:76, t:36, sw:'1deg'},
  {l:66, t:62, sw:'2deg'},    {l:76, t:62, sw:'-1.5deg'},
];
var layer   = document.getElementById('etiquetasLayer');
var tooltip = document.getElementById('tooltip');
var tipTimer;
DOS.forEach(function(d, i) {
  var pos = POS[i % POS.length];
  var el = document.createElement('div');
  el.className = 'banderola';
  el.setAttribute('tabindex','0');
  el.style.left = pos.l + '%';
  el.style.top  = pos.t + '%';
  el.style.setProperty('--color', d.color);
  el.style.setProperty('--swing', pos.sw);
  el.style.setProperty('--d', (i * 0.1).toFixed(2) + 's');
  el.innerHTML =
    '<div class="hilo"></div>' +
    '<div class="flag">' +
      '<div class="flag-top">' +
        '<span class="region">' + d.region + '</span>' +
        '<span class="doname">' + d.do + '</span>' +
      '</div>' +
      '<div class="flag-body">' +
        '<span class="seal">' + d.seal + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="flag-tip"></div>';
  function showTip() {
    clearTimeout(tipTimer);
    tooltip.innerHTML = '<strong>' + d.do + '</strong>' + d.note;
    tooltip.classList.add('show');
  }
  function hideTip() {
    tipTimer = setTimeout(function(){ tooltip.classList.remove('show'); }, 220);
  }
  el.addEventListener('mouseenter', showTip);
  el.addEventListener('mouseleave', hideTip);
  el.addEventListener('focus', showTip);
  el.addEventListener('blur',  hideTip);
  layer.appendChild(el);
});
var stage    = document.getElementById('stage');
var doors    = document.getElementById('doors');
var btnClose = document.getElementById('btnClose');
doors.addEventListener('click',   function(){ stage.classList.add('open'); });
doors.addEventListener('keydown', function(e){
  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); stage.classList.add('open'); }
});
btnClose.addEventListener('click', function(){ stage.classList.remove('open'); });
setTimeout(function(){ stage.classList.add('open'); }, 500);
</script>
</body>
</html>
