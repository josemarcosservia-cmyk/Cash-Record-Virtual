<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bodega de Cash Record</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Marcellus+SC&display=swap" rel="stylesheet">
<style>
/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0c0806}

/* ── BODEGA STAGE ── */
.stage{position:fixed;inset:0;perspective:1400px;perspective-origin:50% 48%;}
.interior{
  position:absolute;inset:0;
  background:
    /* viñeta oscura perimetral */
    radial-gradient(ellipse 110% 90% at 50% 40%, transparent 38%, rgba(4,2,1,.72) 100%),
    /* luz cálida central — efecto linterna */
    radial-gradient(ellipse 55% 48% at 50% 42%, rgba(90,55,18,.38) 0%, transparent 70%),
    /* suelo — tierra oscura */
    linear-gradient(180deg, transparent 65%, rgba(20,10,4,.75) 100%),
    /* techo — vigas oscuras */
    linear-gradient(180deg, rgba(10,5,2,.6) 0%, transparent 18%),
    /* piedra: filas horizontales con variación */
    repeating-linear-gradient(
      180deg,
      rgba(38,22,10,.0) 0px, rgba(38,22,10,.0) 44px,
      rgba(8,4,2,.55)   44px, rgba(8,4,2,.55)   46px
    ),
    /* piedra: columnas verticales desfasadas */
    repeating-linear-gradient(
      90deg,
      rgba(55,32,14,.0)  0px,  rgba(55,32,14,.0)  60px,
      rgba(12,6,3,.4)    60px, rgba(12,6,3,.4)    62px
    ),
    /* color de fondo — piedra cálida */
    linear-gradient(160deg, #2a1a0c 0%, #1c1008 40%, #150d06 70%, #0e0804 100%);
}
  /* ── FONDO FOTOGRAFICO DE LA BODEGA (visible al abrir las puertas) ── */
  .interior{background:radial-gradient(ellipse 110% 90% at 50% 40%, transparent 45%, rgba(4,2,1,.65) 100%), linear-gradient(180deg, rgba(10,5,2,.45) 0%, transparent 20%), url('bodega-fondo.jpg') center/cover no-repeat #0e0804;}
.etiquetas-layer{
  position:absolute;inset:0;pointer-events:none;
  opacity:0;transition:opacity .8s ease 2.4s;
}
.stage.open .etiquetas-layer{opacity:1;pointer-events:auto;}

/* Etiquetas de comunidad autónoma */
.ccaa-label{
  position:absolute;
  font:.38rem/1 'Marcellus SC',serif;letter-spacing:.32em;text-transform:uppercase;
  color:rgba(201,162,75,.45);
  pointer-events:none;white-space:nowrap;
  text-shadow:0 1px 6px rgba(0,0,0,.9);
}

.banderola{
  position:absolute;
  display:flex;flex-direction:column;align-items:center;
  transform-origin:top center;
  transform:rotate(var(--swing,0deg));
  opacity:0;translate:0 -8px;
  transition:opacity .5s ease var(--d,0s), translate .5s ease var(--d,0s), filter .25s ease;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.75));
  cursor:pointer;
}
.stage.open .banderola{opacity:1;translate:0 0;}
.banderola:hover,.banderola:focus-visible{
  filter:drop-shadow(0 6px 16px rgba(0,0,0,.9)) brightness(1.15);
  z-index:20;outline:none;
  animation:sway .55s ease-in-out;
}
@keyframes sway{
  0%{transform:rotate(var(--swing,0deg))}
  30%{transform:rotate(calc(var(--swing,0deg) + 3.5deg))}
  65%{transform:rotate(calc(var(--swing,0deg) - 2deg))}
  100%{transform:rotate(var(--swing,0deg))}
}
.hilo{
  width:1.5px;height:14px;
  background:linear-gradient(180deg,rgba(180,150,70,0),rgba(180,150,70,.9));
  flex-shrink:0;
}
.flag{width:64px;position:relative;}
.flag-top{
  background:var(--color,#7a2233);
  padding:4px 5px 3px;text-align:center;
  border-radius:2px 2px 0 0;
}
.flag-top .region{
  display:block;font:.4rem/1 'Marcellus SC',serif;
  letter-spacing:.16em;color:rgba(255,255,255,.62);text-transform:uppercase;
}
.flag-top .doname{
  display:block;font:.62rem/1.15 'Marcellus',serif;
  color:#fff;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60px;
}
.flag-body{
  background:linear-gradient(170deg,#f2e5c2,#e3cf98);
  padding:5px 4px 4px;text-align:center;
  border-left:1.5px solid rgba(0,0,0,.18);
  border-right:1.5px solid rgba(0,0,0,.18);
}
.flag-body .seal{
  font:700 1rem/1 'Marcellus SC',serif;
  color:var(--color,#7a2233);
  letter-spacing:-.01em;
}
.flag-tip{
  width:64px;height:20px;
  background:linear-gradient(170deg,#f2e5c2,#e3cf98);
  clip-path:polygon(0 0,100% 0,50% 100%);
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.3));
}
.frame{
  position:absolute;inset:0;z-index:3;pointer-events:none;
  box-shadow:
    inset 0 0 0 clamp(28px,6vw,68px) #2a2018,
    inset 0 0 0 calc(clamp(28px,6vw,68px) + 4px) #141009,
    inset 0 0 110px 28px rgba(0,0,0,.7);
}
.frame::after{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:clamp(110px,17vw,190px);height:clamp(36px,5.5vw,66px);
  background:linear-gradient(180deg,#3a2e1e,#22180e);
  clip-path:polygon(16% 0,84% 0,100% 100%,0 100%);
}
.transom{
  position:absolute;top:clamp(10px,2.2vw,24px);left:50%;transform:translateX(-50%);
  text-align:center;z-index:4;pointer-events:none;white-space:nowrap;
  text-shadow:0 2px 12px rgba(0,0,0,.95);
}
.transom .name{font:400 clamp(.85rem,2.8vw,1.9rem)/1.1 'Marcellus',serif;letter-spacing:.14em;color:#c9a24b;}
.transom .sub{font:.58rem/1 'Marcellus SC',serif;letter-spacing:.36em;color:rgba(220,200,145,.5);text-transform:uppercase;margin-top:2px;}
.doors{position:absolute;inset:0;z-index:1;transform-style:preserve-3d;pointer-events:auto;cursor:pointer;}
.door{
  position:absolute;top:0;bottom:0;width:50%;
  background:
    linear-gradient(90deg,rgba(0,0,0,.42),transparent 18%,transparent 82%,rgba(0,0,0,.42)),
    repeating-linear-gradient(90deg,#1c0d04 0 2px,#3a2416 2px 26px,#4e3020 26px 27px,#3a2416 27px 52px);
  box-shadow:inset 0 0 70px rgba(0,0,0,.55);
  transition:transform 2.3s cubic-bezier(.48,.04,.18,1);
  backface-visibility:hidden;will-change:transform;
}
.door::before,.door::after{
  content:"";position:absolute;left:7%;right:7%;height:12px;
  background:linear-gradient(180deg,#1a1410,#0a0806);border-radius:2px;
}
.door::before{top:14%}.door::after{bottom:14%}
.door.left{left:0;transform-origin:left center;border-right:2px solid #0a0604;}
.door.right{right:0;transform-origin:right center;}
.stage.open .door.left{transform:rotateY(-122deg);}
.stage.open .door.right{transform:rotateY(122deg);}
.handle{
  position:absolute;top:50%;width:40px;height:40px;
  border:5px solid #100e0b;border-radius:50%;
  background:radial-gradient(circle at 38% 33%,#4a3f32,#12100c);
  box-shadow:0 3px 7px rgba(0,0,0,.6);transform:translateY(-50%);
}
.door.left  .handle{right:11px;}
.door.right .handle{left:11px;}
.seam{
  position:absolute;top:5%;bottom:5%;left:50%;width:3px;transform:translateX(-50%);
  background:linear-gradient(180deg,transparent,#f4ce82,#e8a94e,transparent);
  filter:blur(2px);opacity:.9;z-index:2;
  animation:flicker 4s ease-in-out infinite;transition:opacity .5s ease;
}
.stage.open .seam{opacity:0;}
/* Puertas abiertas: dejan de interceptar clics */
.stage.open .doors{pointer-events:none !important;cursor:default;}
@keyframes flicker{0%,100%{opacity:.85}48%{opacity:1}72%{opacity:.7}}
.hint{
  position:absolute;bottom:clamp(26px,4.5vh,48px);left:50%;transform:translateX(-50%);
  z-index:7;text-align:center;pointer-events:none;
  font:.62rem/1 'Marcellus SC',serif;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(220,200,145,.58);animation:breathe 3s ease-in-out infinite;transition:opacity .5s ease;
}
.hint span{display:block;margin-top:.4em;font-size:1.2rem;color:#c9a24b;}
.stage.open .hint{opacity:0;}
@keyframes breathe{0%,100%{opacity:.38}50%{opacity:1}}

/* Botón Volver (reemplaza Cerrar) */
.btn-volver{
  position:fixed;top:14px;right:14px;z-index:20;
  font:.62rem/1 'Marcellus SC',serif;letter-spacing:.18em;
  color:#e3d3ad;background:rgba(14,9,5,.72);
  border:1px solid rgba(201,162,75,.4);border-radius:2px;
  padding:8px 14px;cursor:pointer;
  opacity:0;pointer-events:none;
  transition:opacity .5s ease 2.2s;backdrop-filter:blur(4px);
  text-decoration:none;display:inline-block;
}
.stage.open .btn-volver{opacity:1;pointer-events:auto;}
.btn-volver:hover{border-color:#c9a24b;color:#f4ce82;}

.tooltip{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;
  background:rgba(10,6,3,.88);border:1px solid rgba(201,162,75,.4);
  border-radius:3px;padding:8px 16px;
  font:.76rem/1.45 Georgia,serif;color:#e3d3ad;
  text-align:center;max-width:min(340px,86vw);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .25s ease;white-space:normal;
}
.tooltip.show{opacity:1;}
.tooltip strong{color:#c9a24b;font-size:.84rem;display:block;margin-bottom:2px;}
.tooltip .tip-info{display:block;color:#e3d3ad;}
.tooltip .tip-sub{display:block;margin-top:6px;padding-top:6px;border-top:1px solid rgba(201,162,75,.22);font:.68rem/1.45 Georgia,serif;color:rgba(220,200,145,.75);}
.tooltip .tip-sub b{display:block;font:.42rem/1 'Marcellus SC',serif;letter-spacing:.18em;text-transform:uppercase;color:#c9a24b;margin-bottom:3px;font-weight:normal;}
.tooltip.anchored{bottom:auto;}

/* ── AJUSTE A PANTALLA DE ORDENADOR (en móvil se queda igual) ── */
@media (min-width:820px){
  .etiquetas-layer{left:50%;right:auto;width:min(100%,1150px);transform:translateX(-50%);}
  .hint{bottom:78px;}
}

/* ── BUSCADOR ── */
.buscador{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:25;
  width:min(320px,80vw);
  background:rgba(10,6,3,.92);border:1px solid rgba(201,162,75,.35);
  border-radius:3px;backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;
  transition:opacity .5s ease;
}
.buscador.visible{opacity:1;pointer-events:auto;}
.buscador-wrap{
  display:flex;align-items:center;gap:8px;
  padding:9px 14px;
}
.buscador-ico{color:rgba(201,162,75,.55);font-size:14px;flex-shrink:0;}
.buscador-inp{
  flex:1;background:transparent;border:none;
  color:#e3d3ad;font:.68rem/1 'Marcellus SC',serif;letter-spacing:.08em;
  outline:none;
}
.buscador-inp::placeholder{color:rgba(220,200,145,.3);}
.buscador-lista{
  border-top:1px solid rgba(201,162,75,.18);
  max-height:220px;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:rgba(201,162,75,.2) transparent;
}
.buscador-item{
  padding:9px 14px;cursor:pointer;
  border-bottom:1px solid rgba(201,162,75,.08);
  transition:background .15s;
}
.buscador-item:hover{background:rgba(201,162,75,.1);}
.bi-nom{font:.72rem/1 'Marcellus',serif;color:#f0e8d0;}
.bi-do{font:.42rem/1 'Marcellus SC',serif;color:#c9a24b;margin-top:3px;letter-spacing:.12em;text-transform:uppercase;}
.buscador-empty{padding:10px 14px;font:.62rem/1 'Marcellus',serif;color:rgba(220,200,145,.4);text-align:center;}

/* ── OVERLAY DE DO ── */
.ov{
  position:fixed;inset:0;z-index:40;
  background:#0c0806;
  display:flex;flex-direction:column;
  transform:translateY(100%);
  transition:transform .45s cubic-bezier(.22,.61,.36,1);
  overflow:hidden;
}
.ov.show{transform:translateY(0);}

.ov-head{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px 10px;
  border-bottom:1px solid rgba(201,162,75,.18);
  flex-shrink:0;background:#0c0806;
}
.ov-back{
  background:transparent;border:1px solid rgba(201,162,75,.35);
  color:#e3d3ad;font:.58rem/1 'Marcellus SC',serif;letter-spacing:.18em;
  padding:7px 12px;border-radius:2px;cursor:pointer;flex:none;
  transition:border-color .2s,color .2s;
}
.ov-back:hover{border-color:#c9a24b;color:#f4ce82;}
.ov-titulo{flex:1;text-align:center;}
.ov-titulo small{display:block;font:.44rem/1 'Marcellus SC',serif;letter-spacing:.3em;color:rgba(220,200,145,.42);text-transform:uppercase;}
.ov-titulo strong{display:block;font:1.15rem/1.2 'Marcellus',serif;color:#c9a24b;margin-top:3px;}
.ov-hueco{width:74px;flex:none;}

/* Carrusel */
.ov-estante{position:relative;margin-top:6px;flex-shrink:0;}

/* Marco de selección centrado fijo */
.ov-selector{
  position:absolute;left:50%;top:0;bottom:0;
  transform:translateX(-50%);
  width:140px;
  background:rgba(255,255,255,.03);
  border-left:1px solid rgba(201,162,75,.18);
  border-right:1px solid rgba(201,162,75,.18);
  pointer-events:none;z-index:2;
}
.ov-selector::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 55% at 50% 100%,rgba(201,162,75,.13) 0%,transparent 72%);
}

.ov-pista{
  position:relative;z-index:3;
  display:flex;align-items:flex-end;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;-ms-overflow-style:none;
  padding-bottom:4px;
}
.ov-pista::-webkit-scrollbar{display:none;}
.ov-bot{
  flex:0 0 auto;scroll-snap-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  background:none;border:none;padding:0;cursor:pointer;
  height:280px;width:140px;will-change:transform,opacity;
  transition:transform .18s ease, opacity .18s ease;
}
.ov-bot img,.ov-bot .sf{
  height:230px;width:auto;max-width:110px;object-fit:contain;display:block;
  filter:drop-shadow(0 16px 18px rgba(0,0,0,.85));
  transition:filter .18s ease;
}
.ov-bot.centro img,.ov-bot.centro .sf{
  filter:drop-shadow(0 20px 24px rgba(0,0,0,.9)) drop-shadow(0 0 20px rgba(201,162,75,.12));
}
.ov-bot .sf{
  width:78px;height:230px;display:flex;align-items:flex-end;justify-content:center;opacity:.35;
}
.ov-rail{
  position:relative;z-index:4;
  height:1px;margin:0 0 2px;
  background:linear-gradient(to right,transparent,rgba(201,162,75,.35) 18%,rgba(201,162,75,.35) 82%,transparent);
}

/* Flechas de navegación */
.ov-arrow{
  position:absolute;top:50%;transform:translateY(-50%);z-index:10;
  width:36px;height:36px;border-radius:50%;
  border:1px solid rgba(201,162,75,.3);background:rgba(12,8,6,.85);
  color:#c9a24b;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .2s,background .2s;backdrop-filter:blur(4px);
  user-select:none;
}
.ov-arrow:hover{border-color:#c9a24b;background:rgba(30,20,10,.95);}
.ov-arrow.left{left:8px;}
.ov-arrow.right{right:8px;}

/* Ficha */
.ov-ficha{
  text-align:center;padding:14px 22px 16px;
  flex:1;overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;
  min-height:0;
}
.ov-do-label{font:.5rem/1 'Marcellus SC',serif;letter-spacing:.24em;text-transform:uppercase;color:#c9a24b;}
.ov-nom{font:1.3rem/1.15 'Marcellus',serif;color:#f0e8d0;margin-top:5px;}
.ov-bod{font-size:12px;color:rgba(220,200,145,.48);margin-top:3px;}
.ov-precio{font:.8rem/1 'Marcellus SC',serif;color:#c9a24b;margin-top:10px;letter-spacing:.1em;}
.ov-cta{
  margin-top:12px;background:transparent;
  border:1px solid rgba(201,162,75,.4);color:#c9a24b;
  font:.55rem/1 'Marcellus SC',serif;letter-spacing:.18em;
  padding:8px 20px;border-radius:2px;cursor:pointer;transition:.2s;
}
.ov-cta:hover{border-color:#c9a24b;background:rgba(201,162,75,.12);}
.ov-contador{font:.46rem/1 'Marcellus SC',serif;letter-spacing:.18em;color:rgba(220,200,145,.28);padding:12px 0 4px;}
.ov-vacio{color:rgba(220,200,145,.35);padding:40px 20px;font:.8rem/1.6 'Marcellus',serif;}

/* ── MODAL CATA ── */
.mc{
  position:fixed;inset:0;z-index:60;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.mc[hidden]{display:none;}
.mc-bg{position:absolute;inset:0;background:rgba(5,3,1,.85);backdrop-filter:blur(5px);}
.mc-card{
  position:relative;z-index:1;width:100%;max-width:860px;max-height:90vh;overflow-y:auto;
  background:#140e09;border:1px solid rgba(201,162,75,.2);border-radius:6px;
  box-shadow:0 24px 70px rgba(0,0,0,.9);
  animation:mcpop .3s cubic-bezier(.22,.61,.36,1);
}
@keyframes mcpop{from{opacity:0;transform:translateY(16px) scale(.97);}to{opacity:1;transform:none;}}
.mc-close{
  position:absolute;top:12px;right:12px;z-index:3;
  width:32px;height:32px;border-radius:50%;
  border:1px solid rgba(201,162,75,.3);background:rgba(20,14,9,.95);
  color:#e3d3ad;font-size:18px;cursor:pointer;
  transition:border-color .2s,color .2s;
}
.mc-close:hover{border-color:#c9a24b;color:#f4ce82;}
.mc-detail{display:grid;grid-template-columns:170px 1fr 1.15fr;}
.mc-bottle{display:flex;align-items:center;justify-content:center;padding:24px 12px;}
.mc-bottle img{max-height:270px;max-width:120px;object-fit:contain;filter:drop-shadow(0 12px 18px rgba(0,0,0,.8));}
.mc-bottle .sf{width:80px;opacity:.35;display:flex;align-items:center;justify-content:center;}
.mc-radar{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 12px;border-right:1px solid rgba(201,162,75,.14);}
.mc-radar-lbl{font:.44rem/1 'Marcellus SC',serif;letter-spacing:.24em;color:rgba(220,200,145,.4);text-transform:uppercase;margin-bottom:6px;}
.mc-info{padding:24px 20px 22px;}
.mc-info .mc-winery{font:.46rem/1 'Marcellus SC',serif;letter-spacing:.12em;color:rgba(220,200,145,.42);text-transform:uppercase;}
.mc-info h3{font:1.35rem/1.1 'Marcellus',serif;color:#f0e8d0;margin-top:4px;}
.mc-info .mc-do2{font:.48rem/1 'Marcellus SC',serif;letter-spacing:.2em;color:#c9a24b;margin-top:3px;text-transform:uppercase;}
.mc-uva-tag{
  display:inline-block;margin-top:9px;
  font:.46rem/1 'Marcellus SC',serif;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(201,162,75,.75);border:1px solid rgba(201,162,75,.35);
  border-radius:2px;padding:4px 10px;
}
.mc-meta{display:flex;gap:7px;margin-top:14px;}
.mc-meta div{flex:1;background:#0c0806;border:1px solid rgba(201,162,75,.14);border-radius:3px;padding:8px;text-align:center;}
.mc-meta .lbl{font:.4rem/1 'Marcellus SC',serif;letter-spacing:.08em;color:#c9a24b;text-transform:uppercase;}
.mc-meta .val{font:.62rem/1.4 'Marcellus',serif;color:#e3d3ad;margin-top:3px;}
.mc-desc{font-size:13px;line-height:1.68;color:#d4c9b0;margin-top:14px;}
.mc-mar{font-size:12px;color:rgba(220,200,145,.45);margin-top:8px;}
.mc-mar b{color:#c9a24b;font-weight:normal;}
.radar-data{transform-box:fill-box;transform-origin:center;animation:starPop .8s cubic-bezier(.34,1.35,.5,1) both;}
@keyframes starPop{from{opacity:0;transform:scale(.1) rotate(-20deg);}to{opacity:1;transform:none;}}

@media(max-width:620px){
  .mc-detail{grid-template-columns:1fr;}
  .mc-bottle{padding:16px 12px 6px;}
  .mc-radar{border-right:none;border-bottom:1px solid rgba(201,162,75,.14);padding:16px 12px;}
  .mc-info{padding:18px 16px 18px;}
}
@media(max-width:560px){
  .frame{box-shadow:inset 0 0 0 22px #2a2018,inset 0 0 0 26px #141009,inset 0 0 70px 14px rgba(0,0,0,.7);}
  .flag,.flag-tip{width:52px}.flag-top .doname{font-size:.52rem;max-width:48px}
}
@media(prefers-reduced-motion:reduce){
  .door,.banderola,.etiquetas-layer,.ov{transition-duration:.3s}
  .seam,.hint{animation:none}.seam{opacity:.6}
  .banderola:hover{animation:none}
}
</style>
</head>
<body>

<!-- ── BODEGA STAGE ── -->
<div class="stage" id="stage">
  <div class="interior">
    <div class="etiquetas-layer" id="etiquetasLayer"></div>
  </div>
  <div style="position:absolute;inset:0;z-index:6;pointer-events:none;">
    <div class="frame"></div>
    <div class="transom">
      <div class="name">Bodega de Cash Record</div>
      <div class="sub">denominaciones de origen</div>

<script>
/* ══════════════════════════════════════════
   CONSTANTES / SVG
══════════════════════════════════════════ */
var SILUETA = '<svg viewBox="0 0 40 130" fill="none" stroke="#8a8a8a" stroke-width="2"><path d="M16 4h8v26c0 6 8 10 8 22v72a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4V52c0-12 8-16 8-22V4z"/><rect x="9" y="66" width="22" height="30" rx="1"/></svg>';
var LABELS  = ['Cuerpo','Acidez','Fruta','Dulzor','Taninos','Final'];
var ANCHO   = 140;
var COPIAS  = 3;

/* ══════════════════════════════════════════
   DENOMINACIONES + POSICIONES
   Agrupadas por comunidad autónoma
══════════════════════════════════════════ */
var DOS = [
  /* ── GALICIA ── */
  {do:'Rias Baixas',     region:'Galicia',         ccaa:'Galicia',           seal:'RB', color:'#3a6038',
   info:'Blancos atlánticos de Albariño: frescos, florales y con un fondo salino muy marcado.',
   subs:'Val do Salnés · O Rosal · Condado do Tea · Soutomaior · Ribeira do Ulla'},
  {do:'Monterrei',       region:'Galicia',         ccaa:'Galicia',           seal:'MO', color:'#6a3010',
   info:'Godello y Treixadura en blanco, Mencía en tinto. Clima más continental.',
   subs:'Val de Monterrei · Ladeira de Monterrei'},
  {do:'Valdeorras',      region:'Galicia',         ccaa:'Galicia',           seal:'VO', color:'#2a4870',
   info:'Cuna del Godello, sobre suelos de pizarra en el valle del Sil.',
   subs:'O Barco · A Rúa · Vilamartín · Petín · Larouco · Rubiá'},
  {do:'Ribeiro',         region:'Galicia',         ccaa:'Galicia',           seal:'RO', color:'#7a3a18',
   info:'Blancos de Treixadura en los valles que rodean Ribadavia.',

  {do:'Ribeira Sacra',   region:'Galicia',         ccaa:'Galicia',           seal:'RS', color:'#582060',
   info:'Viticultura heroica en bancales sobre el Sil y el Miño. Mencía fresca y fina.',

  /* ── LA RIOJA · CASTILLA Y LEÓN ── */
  {do:'Rioja',           region:'La Rioja',        ccaa:'La Rioja',          seal:'RI', color:'#8a1c2a',
   info:'Tempranillo y crianza en barrica: el tinto clásico español.',
   subs:'Rioja Alta · Rioja Alavesa · Rioja Oriental'},
  {do:'Ribera del Duero',region:'Castilla y León', ccaa:'Castilla y León',   seal:'RD', color:'#6e1a12',

  {do:'Toro',            region:'Castilla y León', ccaa:'Castilla y León',   seal:'TO', color:'#6a2c10',
   info:'Tinta de Toro sobre suelos arenosos: intensos, concentrados y cálidos.',
   subs:'Zamora · Valladolid'},
  /* ── ESPUMOSOS ── */
  {do:'Cava',            region:'Catalunya',       ccaa:'Espumosos',         seal:'CV', color:'#6a5610',
   info:'Espumoso de método tradicional con Macabeo, Xarel·lo y Parellada.',
   subs:'Comtats de Barcelona · Valle del Ebro · Viñedos de Almendralejo · Levante'},
  {do:'Champagne',       region:'Francia',         ccaa:'Espumosos',         seal:'CH', color:'#8a7020',
   info:'Espumoso francés de Chardonnay, Pinot Noir y Meunier, con larga crianza.',
   subs:'Montagne de Reims · Vallée de la Marne · Côte des Blancs · Côte de Sézanne · Côte des Bar'},
];

/* Posiciones agrupadas: izquierda = Galicia / derecha = resto */
var POS = [
  /* Galicia (izquierda) */
  {l:6,  t:12, sw:'-1.5deg'},  /* Rias Baixas   */
  {l:16, t:10, sw:'1deg'   },  /* Monterrei      */
  {l:6,  t:38, sw:'1.5deg' },  /* Valdeorras     */
  {l:16, t:36, sw:'-1deg'  },  /* Ribeiro        */
  {l:11, t:62, sw:'-2deg'  },  /* Ribeira Sacra  */
  /* La Rioja + Castilla y León (derecha arriba) */
  {l:66, t:10, sw:'1.5deg' },  /* Rioja          */
  {l:76, t:12, sw:'-1deg'  },  /* Ribera Duero   */
  {l:71, t:36, sw:'-1.5deg'},  /* Toro           */
  /* Espumosos (derecha abajo) */
  {l:66, t:60, sw:'2deg'   },  /* Cava           */
  {l:76, t:60, sw:'-1.5deg'},  /* Champagne      */
];

/* Etiquetas de zona */
var CCAA_LABELS = [
  {texto:'Galicia',              left:'5%',  top:'4%' },
  {texto:'Rioja · Castilla',     left:'64%', top:'4%' },
  {texto:'Espumosos',            left:'64%', top:'53%'},
];

/* ══════════════════════════════════════════
   DATOS DE VINOS (cargados desde JSON)
══════════════════════════════════════════ */
var VINOS_DATA = {};

fetch('bodega-vinos.json?v=' + Date.now(), {cache:'no-store'})
  .then(function(r){ return r.json(); })
  .then(function(arr){
    arr.forEach(function(g){ VINOS_DATA[g.zona] = g.vinos || []; });
  })
  .catch(function(e){ console.warn('bodega-vinos.json no cargado:', e); });

/* ══════════════════════════════════════════
   RENDER BANDEROLAS + ETIQUETAS CCAA
══════════════════════════════════════════ */
var layer   = document.getElementById('etiquetasLayer');
var tooltip = document.getElementById('tooltip');
var tipTimer;

/* Etiquetas de comunidad */
CCAA_LABELS.forEach(function(z){
  var lbl = document.createElement('div');
  lbl.className = 'ccaa-label';
  lbl.textContent = z.texto;
  lbl.style.left = z.left;
  lbl.style.top  = z.top;
  layer.appendChild(lbl);
});

/* Banderolas */
DOS.forEach(function(d, i){
  var pos = POS[i];
  var el  = document.createElement('div');
  el.className = 'banderola';
  el.setAttribute('tabindex','0');
  el.style.left = pos.l + '%';
  el.style.top  = pos.t + '%';
  el.style.setProperty('--color', d.color);
  el.style.setProperty('--swing', pos.sw);
  el.style.setProperty('--d', (i * 0.1).toFixed(2) + 's');
  el.innerHTML =
    '<div class="hilo"></div>' +
    '<div class="flag">' +
      '<div class="flag-top">' +
        '<span class="region">' + d.region + '</span>' +
        '<span class="doname">' + d.do + '</span>' +
      '</div>' +
      '<div class="flag-body"><span class="seal">' + d.seal + '</span></div>' +
    '</div>' +
    '<div class="flag-tip"></div>';

  function showTip(){
    clearTimeout(tipTimer);
    tooltip.innerHTML =
      '<strong>' + esc(d.do) + '</strong>' +
      '<span class="tip-info">' + esc(d.info || '') + '</span>' +
      (d.subs ? '<span class="tip-sub"><b>Subzonas</b>' + esc(d.subs) + '</span>' : '');
    var r = el.getBoundingClientRect();
    var cx = Math.min(Math.max(r.left + r.width / 2, 180), window.innerWidth - 180);
    tooltip.classList.add('anchored');
    tooltip.style.left = cx + 'px';
    tooltip.style.top  = Math.min(r.bottom + 10, window.innerHeight - 190) + 'px';
    tooltip.classList.add('show');
  }
  function hideTip(){
    tipTimer = setTimeout(function(){ tooltip.classList.remove('show'); }, 220);
  }
  el.addEventListener('mouseenter', showTip);
  el.addEventListener('mouseleave', hideTip);
  el.addEventListener('focus',      showTip);
  el.addEventListener('blur',       hideTip);

  el.addEventListener('click', function(){ abrirDO(d); });
  el.addEventListener('keydown', function(e){
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); abrirDO(d); }
  });

  layer.appendChild(el);
});

/* ══════════════════════════════════════════
   PUERTAS
══════════════════════════════════════════ */
var stage = document.getElementById('stage');
var doors = document.getElementById('doors');

var buscadorEl = document.getElementById('buscador');

function abrirBodega(){
  stage.classList.add('open');
  /* El buscador está fuera del stage → lo activamos directamente desde JS */
  setTimeout(function(){ buscadorEl.classList.add('visible'); }, 2400);
}

doors.addEventListener('click',   abrirBodega);
doors.addEventListener('keydown', function(e){
  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); abrirBodega(); }
});
setTimeout(abrirBodega, 500);

/* ══════════════════════════════════════════
   BUSCADOR
══════════════════════════════════════════ */
var buscadorInp   = document.getElementById('buscadorInp');
var buscadorLista = document.getElementById('buscadorLista');
/* buscadorEl ya declarado arriba */

buscadorInp.addEventListener('input', function(){
  var q = this.value.trim().toLowerCase();
  buscadorLista.innerHTML = '';
  if(!q){ buscadorLista.hidden = true; return; }

  var resultados = [];
  Object.keys(VINOS_DATA).forEach(function(zona){
    (VINOS_DATA[zona] || []).forEach(function(w){
      if((w.nom||'').toLowerCase().indexOf(q) !== -1 ||
         (w.bodega||'').toLowerCase().indexOf(q) !== -1){
        var wc = Object.assign({}, w);
        if(!wc.do) wc.do = zona;
        resultados.push(wc);
      }
    });
  });

  if(!resultados.length){
    buscadorLista.innerHTML = '<div class="buscador-empty">Sin resultados</div>';
  } else {
    resultados.slice(0, 8).forEach(function(w){
      var item = document.createElement('div');
      item.className = 'buscador-item';
      item.innerHTML =
        '<div class="bi-nom">' + esc(w.nom) + '</div>' +
        '<div class="bi-do">' + esc(w.do) + '</div>';
      item.addEventListener('click', function(){
        buscadorInp.value = '';
        buscadorLista.hidden = true;
        abrirCata(w);
      });
      buscadorLista.appendChild(item);
    });
  }
  buscadorLista.hidden = false;
});

document.addEventListener('click', function(e){
  if(!e.target.closest('#buscador')){
    buscadorLista.hidden = true;
  }
});

/* ══════════════════════════════════════════
   OVERLAY DE DO
══════════════════════════════════════════ */
var ovDo     = document.getElementById('ovDo');
var ovBack   = document.getElementById('ovBack');
var ovRegion = document.getElementById('ovRegion');
var ovDoName = document.getElementById('ovDoName');
var ovPista  = document.getElementById('ovPista');
var ovFicha  = document.getElementById('ovFicha');

var ovLista    = [];
var ovCentro   = -1;
var ovAnchoSet = 0;
var ovSaltando = false;
var ovPendiente= false;

function abrirDO(d){
  ovRegion.textContent = d.ccaa || d.region;
  ovDoName.textContent = d.do;
  var vinos = VINOS_DATA[d.do] || [];
  /* añadir zona al objeto si falta */
  vinos = vinos.map(function(w){
    if(!w.do){ var wc = Object.assign({},w); wc.do = d.do; return wc; }
    return w;
  });
  renderCarrusel(vinos);
  ovDo.classList.add('show');
  document.body.style.overflow = 'hidden';
  setTimeout(function(){ ovPista.focus(); }, 460);
}

ovBack.addEventListener('click', function(){ cerrarOverlay(); });

function cerrarOverlay(){
  ovDo.classList.remove('show');
  document.body.style.overflow = '';
  setTimeout(function(){
    ovPista.innerHTML = '';
    ovFicha.innerHTML = '';
    ovLista = [];
    ovCentro = -1;
  }, 460);
}

/* ──  Carrusel ── */
function renderCarrusel(vinos){
  ovPista.innerHTML = '';
  ovFicha.innerHTML = '';
  ovCentro = -1;
  ovLista  = vinos;

  if(!vinos.length){
    ovFicha.innerHTML = '<div class="ov-vacio">Próximamente vinos de esta denominación.</div>';
    return;
  }

  var relleno = 'calc(50% - ' + (ANCHO/2) + 'px)';
  ovPista.style.paddingLeft  = relleno;
  ovPista.style.paddingRight = relleno;

  var copias = vinos.length >= 3 ? COPIAS : 1;
  for(var c = 0; c < copias; c++){
    vinos.forEach(function(w, i){
      var b = document.createElement('button');
      b.className = 'ov-bot';
      b.dataset.i = i;
      b.setAttribute('aria-label', w.nom + ', ' + w.bodega);
      var cuerpo = w.img
        ? '<img src="' + esc(w.img) + '" alt="" loading="lazy" onerror="fbImg(this)">'
        : siluetaEl().outerHTML;
      b.innerHTML = cuerpo;
      b.onclick = function(){
        if(b.classList.contains('centro')){
          abrirCata(w);
        } else {
          b.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
        }
      };
      ovPista.appendChild(b);
    });
  }

  requestAnimationFrame(function(){
    ovAnchoSet = copias > 1 ? vinos.length * ANCHO : 0;
    ovPista.scrollLeft = ovAnchoSet;
    actualizarCarrusel();
  });
}

function siluetaEl(){
  var d = document.createElement('div');
  d.className = 'sf';
  d.innerHTML = SILUETA;
  return d;
}

var EXTS = ['.webp','.png','.jpg','.jpeg'];
function fbImg(el){
  var s = el.getAttribute('src') || '';
  var p = s.lastIndexOf('.');
  var base = p > 0 ? s.slice(0, p) : '';
  var ext = p > 0 ? s.slice(p).toLowerCase() : '';
  var k = EXTS.indexOf(ext);
  if(base && k > -1 && k < EXTS.length - 1){ el.setAttribute('src', base + EXTS[k + 1]); return; }
  var sil = siluetaEl();
  if(el.parentNode && el.parentNode.classList && el.parentNode.classList.contains('mc-bottle')){
    sil.style.width = '80px';
    sil.style.opacity = '.3';
  }
  el.replaceWith(sil);
}

function actualizarCarrusel(){
  var cx    = ovPista.scrollLeft + ovPista.clientWidth / 2;
  var items = ovPista.children;
  var mejor = -1, mejorD = Infinity;
  for(var k = 0; k < items.length; k++){
    var el = items[k];
    var d  = (el.offsetLeft + ANCHO/2 - cx) / ANCHO;
    var ad = Math.abs(d);
    if(ad > 3.5){
      if(el.dataset.lejos !== '1'){
        el.style.transform = 'scale(.52) translateY(10px)';
        el.style.opacity   = '.15';
        el.classList.remove('centro');
        el.dataset.lejos   = '1';
      }
      continue;
    }
    el.dataset.lejos = '0';
    /* escala: centro=1.08, inmediatos=0.82, lejanos=0.55 */
    var sc = ad < 0.5 ? 1.08 : Math.max(0.55, 1.08 - ad * 0.2);
    /* opacidad: centro=1, cae rápido */
    var op = Math.max(0.15, 1 - ad * 0.28);
    /* desplazamiento vertical suave */
    var ty = Math.min(ad * 6, 18);
    el.style.transform = 'scale(' + sc.toFixed(3) + ') translateY(' + ty.toFixed(1) + 'px)';
    el.style.opacity   = op.toFixed(2);
    var esCentro = ad < 0.5;
    el.classList.toggle('centro', esCentro);
    if(ad < mejorD){ mejorD = ad; mejor = +el.dataset.i; }
  }
  if(mejor >= 0 && mejor !== ovCentro){
    ovCentro = mejor;
    pintarFicha(ovLista[ovCentro]);
  }
}

function pintarFicha(w){
  if(!w) return;
  ovFicha.innerHTML =
    '<div class="ov-do-label">' + esc(w.do || '') + '</div>' +
    '<div class="ov-nom">' + esc(w.nom) + '</div>' +
    '<div class="ov-bod">' + esc(w.bodega) + '</div>' +
    '<div class="ov-precio">' + esc(w.subzona || w.do || '') + '</div>' +
    '<button class="ov-cta" id="ovCtaBtn">Ver la cata</button>' +
    '<div class="ov-contador">' + (ovCentro+1) + ' de ' + ovLista.length + '</div>';
  document.getElementById('ovCtaBtn').onclick = function(){ abrirCata(w); };
}

ovPista.addEventListener('scroll', function(){
  if(ovPendiente) return;
  ovPendiente = true;
  requestAnimationFrame(function(){
    ovPendiente = false;
    if(!ovSaltando && ovAnchoSet > 0){
      if(ovPista.scrollLeft < ovAnchoSet * 0.5){
        ovSaltando = true; ovPista.scrollLeft += ovAnchoSet; ovSaltando = false;
      } else if(ovPista.scrollLeft > ovAnchoSet * 2){
        ovSaltando = true; ovPista.scrollLeft -= ovAnchoSet; ovSaltando = false;
      }
    }
    actualizarCarrusel();
  });
}, {passive:true});

ovPista.addEventListener('keydown', function(e){
  if(e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  e.preventDefault();
  ovPista.scrollBy({left:(e.key==='ArrowRight'?1:-1)*ANCHO, behavior:'smooth'});
});

/* Flechas laterales */
document.getElementById('ovArrowL').addEventListener('click', function(){
  ovPista.scrollBy({left:-ANCHO, behavior:'smooth'});
});
document.getElementById('ovArrowR').addEventListener('click', function(){
  ovPista.scrollBy({left:ANCHO, behavior:'smooth'});
});

window.addEventListener('resize', actualizarCarrusel);

/* ══════════════════════════════════════════
   MODAL DE CATA
══════════════════════════════════════════ */
var mcModal = document.getElementById('mcModal');
var mcCard  = document.getElementById('mcCard');

function radar(vals){
  var cx=130,cy=130,R=88,N=6,max=5;
  function ang(i){ return (-90+i*360/N)*Math.PI/180; }
  function pt(i,r){ return [cx+r*Math.cos(ang(i)), cy+r*Math.sin(ang(i))]; }
  var g='';
  for(var a=1;a<max;a++){
    var rr=R*a/max,p='';
    for(var i=0;i<N;i++){var xy=pt(i,rr);p+=(i?'L':'M')+xy[0].toFixed(1)+' '+xy[1].toFixed(1);}
    g+='<path d="'+p+'Z" fill="none" stroke="#b8912a" stroke-width="1" opacity=".6"/>';
  }
  var o='';
  for(var i=0;i<N;i++){var xy=pt(i,R);o+=(i?'L':'M')+xy[0].toFixed(1)+' '+xy[1].toFixed(1);}
  g+='<path d="'+o+'Z" fill="none" stroke="#f5c542" stroke-width="2.8" stroke-linejoin="round"/>';
  for(var i=0;i<N;i++){
    var xy=pt(i,R);
    g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+xy[0].toFixed(1)+'" y2="'+xy[1].toFixed(1)+'" stroke="#f5c542" stroke-width="1.6" opacity=".9"/>';
    var lxy=pt(i,R+20);
    g+='<text x="'+lxy[0].toFixed(1)+'" y="'+lxy[1].toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" font-family="Marcellus,serif" fill="#f5c542">'+LABELS[i]+'</text>';
  }
  var v=Array.isArray(vals)&&vals.length===6?vals:[3,3,3,1,3,3];
  var dp='';
  for(var i=0;i<N;i++){var xy=pt(i,R*v[i]/max);dp+=(i?'L':'M')+xy[0].toFixed(1)+' '+xy[1].toFixed(1);}
  var d='<path d="'+dp+'Z" fill="#e11d2b" fill-opacity=".72" stroke="#f5c542" stroke-width="2" stroke-linejoin="round"/>';
  for(var i=0;i<N;i++){var xy=pt(i,R*v[i]/max);d+='<circle cx="'+xy[0].toFixed(1)+'" cy="'+xy[1].toFixed(1)+'" r="4.5" fill="#f5c542" stroke="#0c0806" stroke-width="1.5"/>';}
  return '<svg viewBox="0 0 260 260" width="100%" style="max-width:280px" role="img" aria-label="Estrella de cata"><g>'+g+'</g><g class="radar-data">'+d+'</g></svg>';
}

function abrirCata(w){
  var src = w.img || '';
  mcCard.innerHTML =
    '<button class="mc-close" data-close aria-label="Cerrar">&#10005;</button>' +
    '<div class="mc-detail">' +
      '<div class="mc-bottle">' +
        (src ? '<img src="'+esc(src)+'" alt="" onerror="fbImg(this)">' : '<div class="sf" style="width:80px;opacity:.3">'+SILUETA+'</div>') +
      '</div>' +
      '<div class="mc-radar"><div class="mc-radar-lbl">Estrella de cata</div>'+radar(w.cata)+'</div>' +
      '<div class="mc-info">' +
        '<div class="mc-winery">'+esc(w.bodega||'')+'</div>' +
        '<h3>'+esc(w.nom)+'</h3>' +
        '<div class="mc-do2">'+esc(w.do||ovDoName.textContent)+'</div>' +
        '<div class="mc-meta">' +
          '<div><div class="lbl">Temperatura</div><div class="val">'+esc(w.temp||'—')+'</div></div>' +
          '<div><div class="lbl">Subzona</div><div class="val">'+esc(w.subzona||'—')+'</div></div>' +
          '<div><div class="lbl">Uvas</div><div class="val">'+esc(w.uva||'—')+'</div></div>' +
        '</div>' +
        '<div class="mc-desc">'+esc(w.desc||'')+'</div>' +
        '<div class="mc-mar"><b>Marida con:</b> '+esc(w.mar||'')+'</div>' +
      '</div>' +
    '</div>';
  mcModal.hidden = false;
}

mcModal.addEventListener('click', function(e){
  if(e.target.hasAttribute('data-close')){
    mcModal.hidden = true;
  }
});

document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  if(!mcModal.hidden){ mcModal.hidden = true; return; }
  if(ovDo.classList.contains('show')){ cerrarOverlay(); }
});

/* ══════════════════════════════════════════
   UTILIDADES
══════════════════════════════════════════ */
function esc(s){
  return String(s||'').replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
</script>
</body>
</html>
